<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#FAFAFA"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Chi-Square Results: Which Feature is Most Useful?</text>
  <text x="360" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Higher bar = stronger connection with loan_status (all p-value ≈ 0)</text>

  <text x="160" y="100" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#1A1A1A">education</text>
  <rect x="170" y="82" width="420" height="28" fill="#2563EB" rx="3"/>
  <text x="600" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2563EB">247.29</text>
  <text x="600" y="118" font-family="Arial, sans-serif" font-size="11" fill="#555">strongest</text>

  <text x="160" y="170" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#1A1A1A">employment</text>
  <rect x="170" y="152" width="142" height="28" fill="#D97706" rx="3"/>
  <text x="322" y="170" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#D97706">83.47</text>

  <text x="160" y="240" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#1A1A1A">property_area</text>
  <rect x="170" y="222" width="136" height="28" fill="#10B981" rx="3"/>
  <text x="316" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#10B981">80.25</text>

  <line x1="170" y1="280" x2="640" y2="280" stroke="#E5E7EB" stroke-width="1"/>
  <text x="170" y="300" font-family="Arial, sans-serif" font-size="11" fill="#888">p &lt; 0.05 line (all 3 features are below this = all significant)</text>

  <text x="360" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1A1A1A">All 3 features passed. But education ranks first.</text>
  <text x="360" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Graduate 77% approved vs Not Graduate 30%</text>
  <text x="360" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Low p-value = unlikely by luck = keep the feature</text>
</svg>
